llama_cpp:
  version: b9585
  builds:
    - os: win
      arch: x64
      backend: vulkan
      url: https://example.invalid/llama-b9585-win-x64-vulkan.zip
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      extract_to: runtime/llama.cpp/win
    - os: win
      arch: x64
      backend: cpu
      url: https://example.invalid/llama-b9585-win-x64-cpu.zip
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      extract_to: runtime/llama.cpp/win/cpu
    - os: linux
      arch: riscv64
      backend: cpu
      url: https://example.invalid/llama-b9585-linux-riscv64-cpu.zip
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      extract_to: runtime/llama.cpp/linux
