# in-app/vulkan peak RSS 14.28 GiB at ctx 8192 — consistent with min 20 (the original estimate
# rested on the issue-#42 field datapoint of ~16 GB resident). The pure-CPU Linux probe read
# 27.5 GiB, but Linux max-RSS counts mmap-resident weight pages and is NOT comparable to the
# Windows PeakWorkingSet basis the catalog RAM lines are calibrated on (the same sweep read the
# 27B-Q5 below the Q4); lines KEPT — Windows-basis re-measure tracked in the wave follow-up.
recommended_min_ram_gb: 20
recommended_ram_gb: 32
# Rank 2 since the wave ratification (owner decision 2026-08-03, model-benchmarks.md §9.3 wave
# outcome): the §2 eval has it at EM parity with the then-24 GB pick qwen3.6-27b-q4 (.9765),
# ZERO unanswerable-set hallucinations after audit, ~4x its decode speed (155.8 vs 40.1 t/s
# vulkan tg; 15.6 vs 2.8 cpu) at 2.5 GB less disk — but F1 .3307 vs .3523 kept the Qwen the
# tier pick (both families share the terse house style, so the gap is not the §9 length
# confound). Ranked runner-up / MoE speed alternative — never the auto-pick while a rank-3
# model fits the tier (asserted in committed-catalog.test.ts). The 24 GB tier itself has since
# moved to qwen3.8-27b-ud-q4km (§9.5, 2026-08-20); this rank-2 verdict is unaffected — it was
# never a claim about which model holds the tier, only about this one not taking it. Was the wave's HEADLINE
# candidate: MoE with ~3.8B ACTIVE params/token (8 of 128 experts) — the qwen3-30b-a3b /
# qwen3.5-35b-a3b total-vs-active trade at 4–8 GB less disk/RAM.
recommendation_rank: 2
recommended_context_tokens: 8192
# Weights that stay HOST-mapped even on a full offload (the embedding/output tensors): the picker
# subtracts them from the estimate's base and before applying its 15 % working share, because the
# runtime buffers that share stands for scale with what is actually ON the card (issue #321, owner
# decision 2026-09-07; base since 2026-09-08, §5 item 22 (e); model-benchmarks.md §6.6 point 3).
# MEASURED, not derived — the app has no GGUF-header parser. Read off the
# `CPU_Mapped model buffer size` line of a FULL-OFFLOAD start (31/31 layers) on the RTX 3090, the
# only card in the project that can hold this model:
# eval/results/hardware/i9-9900x-rtx-3090-24gb-128gb/leg7-moe-host-mapped.stderr.log
# (issue #391, the last open item, 2026-09-08). A PARTIAL offload inflates this line with the
# layers that did not fit, so only full-offload starts count.
host_mapped_weights_mib: 577.50
# Context cache at 8k under the app launch (ubatch 2048); the picker's graphics-fit cache term
# (model-benchmarks.md §6.6, PR #308 audit decision 11).
# MEASURED since 2026-09-08 (issue #412), replacing the 1.5 derived before this model had ever
# been started. The first hardware start (#391, the RTX 3090 -- the only card in the project that
# holds it) logged the iswa pair at ONE sequence: 160.00 MiB (8192 cells, 5 layers, 1/1 seqs)
# non-SWA + 600.00 MiB (3072 cells, 25 layers, 1/1 seqs) SWA = 760.00 MiB, against the 1,536 the
# old term claimed. Evidence:
# eval/results/hardware/i9-9900x-rtx-3090-24gb-128gb/leg7-moe-host-mapped.stderr.log
# WHY IT DRIFTED is deliberately NOT recorded as a cause. The old derivation was exactly double the
# measurement on both halves, which invites "it assumed 4 bytes per element where llama.cpp
# allocates 2" -- but the 12B twin's derivation, written the same way, is 4x high on its
# full-attention half (512 derived, 128.00 measured) and EXACT on its sliding-window half (1,920
# both), so no single per-element error explains the family. A K/V double-count fits this model's
# two halves just as well, and nothing separates the two. These terms were derived per model, by
# hand; this one had no log to check against and nothing forced the check.
# 0.8 GiB (819.2 MiB), not 0.7: one decimal is the file convention and 760.00 MiB rounds nearer to
# 0.7, but five of the seven terms sit at or above their own figure and 0.8 keeps 59 MiB of
# headroom. Little turns on the choice -- VRAM_FIT_MARGIN_MIB adds 1 GiB on top of the whole
# estimate, and the star does not move at either value (see the threshold note below).
# UNCHANGED by the 2026-09-07 `-np 1` recomputation (issue #319), and the measurement CONFIRMS that
# reasoning: this architecture has NO recurrent state, the recurrent state is the only per-SEQUENCE
# term, and both Gemma caches are sized in CELLS from --ctx-size and counted once whatever the slot
# count is -- both halves above log "1/1 seqs" (the 12B twin logs the same caches as "4/1 seqs",
# four sequences over ONE cache:
# eval/results/hardware/i9-14900k-rtx-3080-ti-12gb-64gb/leg3-baseline.stderr.log).
# THRESHOLD: this drops `estimateGraphicsNeedMib` from 17,689 to 16,972 MiB (717 MiB). The star does
# not move anywhere: swept over every budget from 1,000 to 49,152 MiB against ten RAM sizes, with
# and without a crawl signal measured on each chat model, the pick is identical before and after --
# this model is rank 2 and never wins rule C at any point in that sweep (asserted in
# committed-catalog.test.ts). What DOES change is the Performance screen's "Your model" row for
# someone who installed this model by hand and has not started it yet: it no longer overstates the
# card requirement by 717 MiB.
estimated_context_cache_gib: 0.8
