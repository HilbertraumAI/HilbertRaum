# MEASURED 2026-07-30 (i9-9900X, b9849 linux; model-benchmarks.md §9.3): cpu peak RSS 4.40 GiB
# / vulkan 3.69 GiB at ctx 8192 → min 8 CONFIRMED (formula ceil(4.40+3) = 8).
# Hard min is the MODEL-ALONE floor (PROD-1); co-residency pressure lives in recommended_ram_gb.
# recommended_ram_gb deliberately sits on the small-tier 16 floor (qwen3-4b/qwen3.5-4b/8B tier all
# share 16): a UNIQUE lower value would make this the only "comfortable fit" at that RAM level and
# the preferRanked guard (empty ranked set → all fits) would auto-recommend a rank-0 model —
# caught by the wave-invariant test at ram=12 when this briefly said 12.
recommended_min_ram_gb: 8
recommended_ram_gb: 16
# Rank 0 AFTER the wave eval (§9.3 wave outcome, ratified 2026-08-03): F1 .3373 edges the
# bundled qwen3-4b (.3277) with equal audited hallucinations (3) and the fastest CPU decode
# measured in the catalog (24.3 t/s tg) — but qwen3-4b-2507 keeps the tier quality lead (.3613,
# 1 real) and the issue-#53 weak-16 GB-box measured-tok/s leg is STILL OWED, so the rank stays
# 0 until that datapoint lands (wave follow-up issue). E2B is a MatFormer effective-2B slice
# (~5B raw params, ~2B-class memory/compute footprint), 140+ languages — on a machine where
# tok/s is the binding constraint it is the current speed/quality frontier candidate.
recommendation_rank: 0
recommended_context_tokens: 8192
# Thinking VERIFIED PER SIZE 2026-07-30 (§9.3): thinks by default on the raw server;
# `enable_thinking: false` suppresses cleanly (0 reasoning chars, content intact). Deep vs
# Balanced on the 8-item set: 7/8 vs 8/8 (arithmetic slip on train-arrival) — the flip rule
# says Deep adds nothing at this size (eval/results/gemma-thinking-i9-9900X-e2b.json).
supports_thinking_mode: true
supports_tools: false
local_path: models/chat/gemma4-e2b-it-qat-q4.gguf
