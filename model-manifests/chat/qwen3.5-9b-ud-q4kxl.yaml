# 12 GB minimum is intentionally conservative: the file is ~5.97 decimal GB but Electron +
# SQLite + the embedding/reranker sidecars + KV cache all need headroom alongside it.
# MEASURED 2026-07-30 (i9-9900X, b9849 linux; model-benchmarks.md §9.3): vulkan/in-app peak RSS
# 6.57 GiB / cpu 7.93 GiB at ctx 8192 (formula 10–11 ≤ committed 12 — confirmed conservative).
# §9.1 through-the-app smoke PASSED all legs 2026-07-30 (closing the §6.4/license-note
# "§9.1 remains open" residual for this model).
recommended_min_ram_gb: 12
recommended_ram_gb: 16
# Rank 3 (owner decision 2026-07-12, newest-generation preference; model-benchmarks.md §6.4):
# a subjective owner judgment that newer model generations improve on the ones they replace, so
# the newest-generation model is recommended per tier. The #48 tester eval ranked this UNDER the
# incumbent Ministral 3 8B ONLY on the hallucination-trap axis (the `en-contract-penalty`
# invoice-distractor trap, where Ministral is clean); on F1/EM the 9B actually EDGED Ministral
# within cross-run tolerance (F1 .3152/.3124 vs Ministral's Phase-29 i7 .3111, EM .9765 vs .9529)
# — and F1 is length-confounded per the §9 scorer caveats anyway, so the eval is treated as
# directional, not decisive. It
# HAS been through the tester eval on the b9849 binary (both this UD-Q4_K_XL and the local Q8
# ran), which also discharges the old load-smoke gate. Picker effect (with the full 2026-07-12
# promotion set): wins 16-20 GB from Ministral (rank 2); within the promoted pair at this tier
# (the 4B carries the same rank 3 and recommended_ram_gb 16) it wins on the disk-size tiebreak.
recommendation_rank: 3
# Native context is 262,144 tokens (extensible to ~1,010,000 via YaRN). HilbertRaum recommends
# 8192 here because this field is the SAFE LOCAL RUNTIME context budget for normal laptops, not
# the theoretical model maximum. Revisit only after KV-cache/RAM budgeting + a long-context eval.
recommended_context_tokens: 8192
# Context cache at 8k under the app launch, recomputed 2026-09-07 for ONE server slot (issue #319:
# CHAT_SERVER_ARGS now passes `-np 1`; the b9849 default of 4 unified slots is gone). 256 MiB
# full-attention KV (8 layers x 4 heads x 256), counted ONCE -- it is sized in CELLS from --ctx-size
# and does not change with the slot count -- plus 1 x 48 MiB recurrent state instead of 4 x 48
# (the recurrent state is the only per-SEQUENCE term) = 304 MiB = 0.297 GiB -> 0.3 (no SWA cache;
# no MTP -- this manifest does not opt into speculative_decoding).
# Cross-check against a real start, eval/results/hardware/i9-14900k-rtx-3080-ti-12gb-64gb/leg5-baseline.stderr.log
# (33/33 layers, 4 slots): KV 256.00 + RS 201.00 = 457 MiB measured against the old 0.4 GiB term;
# at one slot that reads 256.00 + 201.00/4 = 306.25 MiB, within 2 MiB of the derivation above.
# The picker's graphics-fit cache term (model-benchmarks.md §6.6, PR #308 audit decision 11,
# amended 2026-09-07 by #319).
estimated_context_cache_gib: 0.3

# The weights that stay HOST-mapped even on a full offload (embedding / output tables), MiB —
# the picker subtracts them before applying its 15 % working share, because the runtime buffers
# that share stands for scale with what is actually ON the card (issue #321, owner decision
# 2026-09-07; model-benchmarks.md §6.6 point 3).
# MEASURED, not derived — the app has no GGUF-header parser. Read off the
# `CPU_Mapped model buffer size` line of a FULL-OFFLOAD start (33/33 layers):
# eval/results/hardware/i9-14900k-rtx-3080-ti-12gb-64gb/leg5-baseline.stderr.log
# A PARTIAL offload inflates this line with the layers that did not fit, so only full-offload
# starts count. Absent on any model never started on hardware, which then keeps the old
# whole-file arithmetic; the GGUF-header derivation that would cover every model is
# BUILD_STATE §5 item 22 (e), still open.
host_mapped_weights_mib: 545.62
# Qwen3.5 0.8B/2B/4B/9B have reasoning DISABLED by default in unsloth's llama.cpp examples
# unless `enable_thinking=true`; the chat template still honours the switch, so the Deep answer
# mode applies. Verify the live runtime behaviour by smoke test (BUILD_STATE Qwen3.5 wave).
supports_thinking_mode: true
supports_tools: true
